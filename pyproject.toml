[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "objectdna"
version = "0.1.0"
authors = [{name = "Nazeeh Abdul-Hadi"}]
description = "Evidence-aware scan to editable engineering CAD"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = ["cadquery>=2.6,<2.7", "numpy>=2,<3", "scipy>=1.14,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20", "trimesh>=5.2,<6"]

[project.optional-dependencies]
research = ["scikit-learn>=1.6,<2", "pillow>=11", "imageio>=2.36"]
test = ["pytest>=8", "httpx>=0.28"]

[project.scripts]
objectdna = "objectdna.cli:main"

[tool.setuptools.packages.find]
include = ["objectdna*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
objectdna = ["assets/*", "assets/**/*", "assets/**/**/*", "assets/**/**/**/*"]

[project.urls]
Repository = "https://github.com/nazeeh111/ObjectDNA"
Documentation = "https://github.com/nazeeh111/ObjectDNA#readme"
Issues = "https://github.com/nazeeh111/ObjectDNA/issues"
Releases = "https://github.com/nazeeh111/ObjectDNA/releases"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["results", "objectdna/assets", "build", "web"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
